}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;transition:background-color .4s,color .4s}
body{overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:400;opacity:var(--grain);mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--text);outline-offset:2px}
img{display:block}

/* логотип: ваши монограмма и надпись, окрашенные хромом */
.logo-mono,.logo-word{display:block;background:var(--chrome);background-size:220% 100%;background-position:30% 0;
  -webkit-mask:var(--mono-mask) center/contain no-repeat;mask:var(--mono-mask) center/contain no-repeat}
.logo-mono{aspect-ratio:318/360}
.logo-word{aspect-ratio:822/64;-webkit-mask-image:var(--word-mask);mask-image:var(--word-mask)}
.tag{display:inline-flex;align-items:center;height:28px;padding:0 13px;border:1px solid var(--line2);border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}

/* ---------- заставка ---------- */
.splash{position:fixed;inset:0;z-index:500;background:#050507;display:grid;place-items:center;animation:splashOut .6s var(--ease) 1.5s forwards;
  --chrome:linear-gradient(100deg,#77747a 0%,#c9c8cc 28%,#ffffff 46%,#bdbbc0 60%,#6f6c72 100%)}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:26px}
.sp-mono{width:96px;animation:monoIn 1s var(--ease) both,shine 1.6s ease-in-out .3s both}
.sp-word{width:210px;opacity:0;animation:wordIn .9s var(--ease) .45s forwards}
@keyframes monoIn{from{opacity:0;transform:scale(1.18);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
@keyframes wordIn{from{opacity:0;transform:translateY(6px);letter-spacing:0}to{opacity:.9;transform:none}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}

/* ---------- шапка ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo-mono{width:27px}
.brand .logo-word{width:112px}
.pills{display:flex;gap:6px;flex:none}
.pill{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:11px;font-weight:700;letter-spacing:.08em;transition:transform .2s var(--spring),background .2s}
.pill:active{transform:scale(.92)}
.pill svg{width:14px;height:14px}
.pill.icon{width:34px;padding:0;justify-content:center}
.pill.dark{background:var(--inv);color:var(--inv-text);border-color:var(--inv)}
.theme-ic{transition:transform .5s var(--spring)}
[data-theme="light"] .theme-ic{transform:rotate(180deg)}

/* ---------- первый экран ---------- */
.hero{position:relative;padding:30px 16px 6px;overflow:hidden}
.glow{position:absolute;right:-45%;top:-8%;width:130%;height:640px;pointer-events:none;
  background:radial-gradient(closest-side,var(--glow),transparent 72%);filter:blur(10px);animation:breathe 9s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55;transform:translateY(20px) scale(1.06)}}
.crumb{position:relative;margin:0 0 18px;font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.crumb b{color:var(--text);font-weight:800}
.h1{position:relative;margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(31px,9.6vw,60px);line-height:1.02;letter-spacing:-.005em}
.h1 .ln{display:block;overflow:hidden;padding:0 .08em .06em 0}
.h1 .ln > span{display:inline-block;transform:translateY(110%);animation:rowIn 1s var(--ease) forwards}
.h1 .ln:nth-child(2) > span{animation-delay:.1s}
.h1 .ln:nth-child(3) > span{animation-delay:.2s}
.h1 .acc > span{font-weight:500;text-transform:lowercase;letter-spacing:.01em;font-style:normal;
  background:var(--chrome);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  transform:translateY(110%) skewX(-12deg);animation:rowInSkew 1s var(--ease) .2s forwards,chromeMove 7s ease-in-out 1.4s infinite}
.splashed .h1 .ln > span{animation-delay:1.65s}
.splashed .h1 .ln:nth-child(2) > span{animation-delay:1.75s}
.splashed .h1 .acc > span{animation-delay:1.85s,3s}
@keyframes rowIn{to{transform:none}}
@keyframes rowInSkew{to{transform:skewX(-12deg)}}
@keyframes chromeMove{50%{background-position:100% 0}}
.lead{position:relative;max-width:34ch;margin:18px 0 22px;font-size:14px;line-height:1.6;color:var(--muted)}
.ctas{position:relative;display:flex;gap:8px;flex-wrap:wrap}
.btn-w,.btn-o{height:46px;padding:0 20px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;transition:transform .2s var(--spring),background .2s}
.btn-w{background:var(--inv);color:var(--inv-text)}
.btn-o{border:1px solid var(--line2)}
.btn-w:active,.btn-o:active{transform:scale(.95)}
.stats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;border:1px solid var(--line2);border-radius:18px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.stat{padding:12px 10px;text-align:center}
.stat + .stat{border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:-.01em}
.stat span{display:block;margin-top:3px;font-size:10.5px;color:var(--muted);line-height:1.3}

/* витрина с обложкой */
.show{position:relative;margin:30px 4px 0;perspective:1200px}
.frame{position:relative;aspect-ratio:4/5;border-radius:24px;overflow:hidden;background:var(--surface);border:1px solid var(--line2);
  box-shadow:0 40px 80px -40px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);animation:floatIn 1.2s var(--ease) .3s both}
.splashed .frame{animation-delay:1.8s}
@keyframes floatIn{from{opacity:0;transform:translateY(40px) rotateX(8deg)}}
.frame::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 32%,transparent 70%,rgba(255,255,255,.06))}
.media,.media img,.media video,.media iframe{border:0;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media.empty{display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 100%,var(--raised),var(--surface) 60%)}
.media.empty .logo-mono{width:34%;filter:drop-shadow(0 20px 40px rgba(0,0,0,.4))}
.chip{position:absolute;left:14px;bottom:14px;z-index:2;height:28px;display:flex;align-items:center;padding:0 12px;border-radius:999px;background:rgba(8,8,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.hero-edit{position:absolute;right:12px;top:12px;z-index:3;height:36px;padding:0 14px;border-radius:999px;background:rgba(8,8,12,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:12px;font-weight:700}
body:not(.admin) .hero-edit{display:none}
.pedestal{position:relative;width:88%;height:18px;margin:-2px auto 0;border-radius:0 0 14px 14px;background:linear-gradient(var(--surface2),var(--bg2));border:1px solid var(--line);border-top:0}
.pedestal::before{content:"";position:absolute;left:6%;right:6%;top:6px;height:2px;border-radius:2px;background:var(--glow2);box-shadow:0 0 14px 2px var(--glow2),0 0 40px 8px var(--glow);animation:neon 4s ease-in-out infinite}
.pedestal::after{content:"";position:absolute;left:-10%;right:-10%;top:16px;height:60px;background:radial-gradient(closest-side,var(--glow),transparent);filter:blur(6px)}
@keyframes neon{50%{opacity:.6}}

/* бегущая строка */
.marquee{position:relative;margin-top:44px;padding:16px 0;overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  -webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq-in{display:inline-flex;animation:tick 32s linear infinite}
.mq-in span{display:inline-flex;align-items:center;gap:22px;padding-right:22px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.mq-in span::after{content:"✦";font-size:10px;color:var(--muted)}
@keyframes tick{to{transform:translateX(-50%)}}

/* ---------- каталог ---------- */
.sec-head{padding:44px 16px 14px}
.h2{margin:14px 0 0;font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;text-transform:uppercase;letter-spacing:-.005em}
.h2 sup{font-family:var(--body);font-size:12px;font-weight:700;color:var(--muted);margin-left:6px;letter-spacing:.1em}
.chips-wrap{position:sticky;top:var(--hh,54px);z-index:35;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.chips{position:relative;display:flex;gap:6px;overflow-x:auto;padding:9px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-c{position:relative;z-index:1;flex:none;height:34px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);transition:color .3s,border-color .3s}
.chip-c.on{color:var(--inv-text);border-color:transparent}
.ind{position:absolute;top:9px;height:34px;border-radius:999px;background:var(--inv);transition:left .45s var(--spring),width .45s var(--spring);z-index:0}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;padding:16px 12px 10px}
.card{display:flex;flex-direction:column;gap:7px;text-align:left;min-width:0}
.grid.swap .card{animation:cardIn .55s var(--ease) both;animation-delay:calc(var(--i) * 35ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ph{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(100deg,var(--surface) 30%,var(--surface2) 50%,var(--surface) 70%) 0 0/250% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{to{background-position:-250% 0}}
.ph img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .5s var(--ease),transform .7s var(--ease)}
.ph img.ok{opacity:1;transform:none}
.card:active .ph img.ok{transform:scale(.96)}
.ph.out img{filter:grayscale(1);opacity:.45}
.plate{position:absolute;top:6px;left:6px;padding:4px 7px;border-radius:999px;background:rgba(8,8,12,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;line-height:1}
.plate.hid{background:var(--signal);border-color:var(--signal)}
.tape{position:absolute;left:-20%;right:-20%;top:46%;transform:rotate(-14deg);background:var(--inv);color:var(--inv-text);font-size:8.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:4px 0;white-space:nowrap;overflow:hidden}
.c-name{font-size:11.5px;line-height:1.3;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-price{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-3px;color:var(--muted)}
.empty{grid-column:1/-1;padding:60px 10px;text-align:center;color:var(--muted);font-size:14px}

/* как заказать */
.steps{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;padding:0 16px}
.step{padding:18px 0 4px;border-top:1px solid var(--line2)}
.step i{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line2);border-radius:10px;margin-bottom:14px}
.step i svg{width:16px;height:16px}
.step small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.step b{display:block;margin:6px 0 6px;font-family:var(--display);font-weight:600;font-size:12.5px;line-height:1.25;text-transform:uppercase}
.step p{margin:0 0 14px;font-size:12.5px;line-height:1.55;color:var(--muted)}

/* подвал */
.foot{position:relative;margin-top:44px;padding:48px 16px calc(130px + env(safe-area-inset-bottom));text-align:center;border-top:1px solid var(--line);overflow:hidden}
.foot::before{content:"";position:absolute;left:50%;top:-60px;width:120%;height:260px;transform:translateX(-50%);background:radial-gradient(closest-side,var(--glow),transparent);opacity:.7;pointer-events:none}
.foot .logo-mono{position:relative;width:78px;margin:0 auto 22px}
.foot .logo-word{position:relative;width:min(300px,80%);margin:0 auto}
.foot p{position:relative;margin:18px auto 20px;font-size:13px;color:var(--muted);max-width:30ch;line-height:1.5}
.links{position:relative;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.links button{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.copy{position:relative;display:block;margin-top:26px;font-size:9.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}

/* ---------- корзина внизу ---------- */
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:45;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 18px;border-radius:999px;background:var(--inv);color:var(--inv-text);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  transform:translateY(160%);transition:transform .55s var(--spring);box-shadow:0 18px 40px -14px rgba(0,0,0,.6),0 0 30px -6px var(--glow)}
.cartbar.show{transform:none}
.cartbar.bump{animation:bump .5s var(--spring)}
@keyframes bump{30%{transform:scale(1.05)}}
.cartbar .l{display:flex;align-items:center;gap:10px}
.cnt{min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--inv-text);color:var(--inv);display:inline-grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:0}
.cnt.pop{animation:pop .45s var(--spring)}
@keyframes pop{40%{transform:scale(1.5)}}
.cartbar .r{height:42px;padding:0 16px;border-radius:999px;background:var(--inv-text);color:var(--inv);display:flex;align-items:center;letter-spacing:.02em;text-transform:none;font-size:13.5px}
.fly{position:fixed;z-index:300;border-radius:10px;object-fit:cover;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}

/* ---------- полноэкранные панели ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateY(102%);transition:transform .5s var(--ease);padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}
.sheet.instant{transition:none}
.sh-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.sh-title{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.x{width:38px;height:38px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);display:grid;place-items:center;transition:transform .2s var(--spring)}
.x:active{transform:scale(.9)}
.x svg{width:13px;height:13px}
.tools{display:flex;gap:8px;align-items:center}
.p-sheet .sh-head{position:fixed;left:0;right:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border:0}
.p-sheet .x{background:rgba(8,8,12,.55);border-color:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.gal-wrap{position:relative;background:var(--surface2)}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{flex:none;width:100%;aspect-ratio:4/5;object-fit:cover;scroll-snap-align:start}
.dots{position:absolute;left:14px;right:14px;bottom:12px;display:flex;gap:4px}
.dots i{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.dots i::after{content:"";display:block;height:100%;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.dots i.on::after{transform:none}
.p-body{padding:22px 16px}
.sheet.open .p-body > *{animation:cardIn .6s var(--ease) both}
.sheet.open .p-body > *:nth-child(2){animation-delay:.05s}
.sheet.open .p-body > *:nth-child(3){animation-delay:.1s}
.sheet.open .p-body > *:nth-child(4){animation-delay:.15s}
.sheet.open .p-body > *:nth-child(n+5){animation-delay:.2s}
.p-cat{font-size:10px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.p-name{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.15;text-transform:uppercase;margin:10px 0 14px}
.p-price{font-size:24px;font-weight:800}
.p-base{font-size:12.5px;color:var(--muted);margin-top:4px}
.blk{margin-top:26px}
.blk h3,.form h3,.ed h3{margin:0 0 10px;font-size:10px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.size{min-width:54px;height:46px;padding:0 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);font-weight:800;font-size:13px;transition:transform .25s var(--spring),background .2s,color .2s}
.size:active{transform:scale(.92)}
.size.on{background:var(--inv);color:var(--inv-text);border-color:var(--inv);transform:scale(1.04)}
.size:disabled,.size.so{background:transparent;border:1px dashed var(--faint);color:var(--faint);text-decoration:line-through;cursor:not-allowed}
.size.so{cursor:pointer}
.hint{min-height:18px;margin-top:8px;font-size:13px;font-weight:600;color:var(--signal)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.p-desc{font-size:14.5px;line-height:1.65;white-space:pre-line;max-width:60ch;color:var(--muted)}
.ask{margin-top:20px;font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.dock{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:4}
.btn{position:relative;width:100%;height:58px;border-radius:999px;background:var(--inv);color:var(--inv-text);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;overflow:hidden;transition:transform .2s var(--spring),opacity .3s;box-shadow:0 0 34px -10px var(--glow)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45}
.btn .ok-ic{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:translateY(100%);transition:.35s var(--ease)}
.btn .ok-ic svg path{stroke:var(--inv-text)}
.btn .lbl{display:block;transition:.35s var(--ease)}
.btn.added .lbl{opacity:0;transform:translateY(-100%)}
.btn.added .ok-ic{opacity:1;transform:none}
.btn.light{background:transparent;color:var(--text);border:1px solid var(--line2);box-shadow:none}

/* корзина */
.c-item{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--line);animation:cardIn .45s var(--ease) both}
.c-item img{width:70px;height:92px;border-radius:10px;object-fit:cover;background:var(--surface2)}
.c-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.c-info .n{font-size:14px;font-weight:700;line-height:1.3}
.c-info .s{font-size:12.5px;color:var(--muted)}
.c-info .p{margin-top:auto;font-weight:800}
.qty{align-self:flex-end;display:flex;align-items:center;gap:4px;border:1px solid var(--line2);border-radius:999px;padding:3px}
.qty button{width:30px;height:30px;border-radius:999px;font-size:17px;font-weight:600}
.qty button:active{background:var(--surface2)}
.qty span{min-width:18px;text-align:center;font-weight:800;font-size:14px}
.sum{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 14px 6px}
.sum span:first-child{font-family:var(--display);font-weight:700;font-size:16px;text-transform:uppercase}
.sum b{font-size:20px;display:block;text-align:right}
.sum small{display:block;text-align:right;font-size:12px;color:var(--muted);margin-top:2px}
.form{padding:0 14px}
.form h3{margin-top:26px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border-radius:18px;padding:14px;border:1px solid var(--line);transition:border-color .25s,transform .2s var(--spring)}
.opt:active{transform:scale(.98)}
.opt.on{border-color:var(--text)}
.opt .dot{flex:none;width:20px;height:20px;border-radius:999px;border:2px solid var(--faint);margin-top:1px;transition:border .3s var(--spring)}
.opt.on .dot{border:6px solid var(--text)}
.opt b{display:block;font-size:14.5px}
.opt small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.opt.wide{width:100%}
.field{display:block;margin-top:8px}
.field input,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:14px;font-size:15px;outline:none;transition:border-color .2s}
.field input::placeholder,.field textarea::placeholder{color:var(--faint)}
.field input:focus,.field textarea:focus{border-color:var(--text)}
.field.bad input{border-color:var(--signal)}
.field textarea{min-height:76px;resize:vertical}

/* готово */
.done{padding:48px 22px;text-align:center}
.check{width:86px;height:86px;margin:0 auto;color:var(--text)}
.check circle{stroke-dasharray:252;stroke-dashoffset:252;animation:draw .7s var(--ease) forwards}
.check path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .45s var(--ease) .55s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done h2{font-family:var(--display);font-weight:800;font-size:30px;text-transform:uppercase;margin:20px 0 8px}
.done p{font-size:14.5px;line-height:1.55;color:var(--muted);max-width:34ch;margin:0 auto 18px}
.done pre{text-align:left;white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;font:500 12.5px/1.5 var(--body);margin:0 0 14px}
.done .btn + .btn{margin-top:8px}

/* ---------- язык и валюта ---------- */
.picker{position:fixed;inset:0;z-index:80;pointer-events:none}
.picker.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .35s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.picker.open .scrim{opacity:1}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:82vh;display:flex;flex-direction:column;background:var(--bg2);border-top:1px solid var(--line2);border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .5s var(--spring);padding-bottom:env(safe-area-inset-bottom)}
.picker.open .panel{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line2);margin:9px auto 0}
.pk-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px}
.pk-search{padding:4px 16px 8px}
.pk-search input{width:100%;height:46px;border:1px solid var(--line2);border-radius:16px;background:var(--surface);padding:0 14px;font-size:15px;outline:none}
.pk-body{overflow-y:auto;padding:0 8px 16px}
.pk-sep{padding:16px 10px 6px;font-size:10px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;padding:8px 10px;border-radius:14px;text-align:left;transition:background .2s}
.row:active{background:var(--surface2)}
.row .code{display:inline-block;min-width:48px;font-weight:800;font-size:13px;letter-spacing:.06em}
.row .nm{color:var(--muted);font-size:14px}
.row.on{background:var(--surface)}
.row .tick{width:22px;height:22px;border-radius:999px;background:var(--inv);display:grid;place-items:center}
.row .tick svg path{stroke:var(--inv-text)}
.note{padding:10px 10px 0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.pk-form{padding:4px 16px 18px}
.pk-form .btn{margin-top:12px}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));z-index:350;transform:translate(-50%,-160%);background:var(--inv);color:var(--inv-text);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;transition:transform .45s var(--spring);white-space:nowrap;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.toast.show{transform:translate(-50%,0)}

/* ---------- видео ---------- */
.vslide{position:relative;flex:none;width:100%;aspect-ratio:4/5;scroll-snap-align:start;background:#111}
.vslide video,.vslide iframe{width:100%;height:100%;object-fit:cover;border:0;display:block}
.snd{position:absolute;right:12px;bottom:28px;width:40px;height:40px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;transition:transform .2s var(--spring)}
.snd:active{transform:scale(.9)}
.snd svg{width:18px;height:18px}
.vbadge{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:999px;background:rgba(0,0,0,.65);display:grid;place-items:center}
.vbadge svg{width:9px;height:9px;margin-left:2px}

/* ---------- режим админа ---------- */
.demo-bar{display:none;position:sticky;top:var(--hh,54px);z-index:39;padding:10px 14px;background:#ffb020;color:#111;font-size:12.5px;font-weight:700;line-height:1.4}
body.admin.demo .demo-bar{display:block}
.fab{position:fixed;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:44;width:58px;height:58px;border-radius:999px;background:var(--inv);color:var(--inv-text);display:grid;place-items:center;box-shadow:0 14px 30px -8px rgba(0,0,0,.55),0 0 26px -6px var(--glow);transition:transform .25s var(--spring);animation:fabIn .5s var(--spring)}
.fab:active{transform:scale(.9)}
.fab svg{width:22px;height:22px}
@keyframes fabIn{from{transform:scale(0)}}
body.admin .brand .logo-word{display:none}
body:not(.admin) .fab,body:not(.admin) #adminPill,body:not(.admin) #ordersPill,body:not(.admin) #editBtn{display:none}
.edit-btn{height:38px;padding:0 16px;border-radius:999px;background:rgba(8,8,12,.6);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:700;font-size:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .2s var(--spring)}
.edit-btn:active{transform:scale(.93)}
.ed{padding:2px 14px}
.ed h3{margin-top:24px}
.ed-note{font-size:12.5px;line-height:1.5;color:var(--muted);margin:8px 0 0}
.ed-photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.th{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);animation:cardIn .35s var(--ease) both}
.th img{width:100%;height:100%;object-fit:cover}
.th .del,.th .mv{position:absolute;top:5px;width:26px;height:26px;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;font-size:14px;font-weight:700;display:grid;place-items:center}
.th .del{right:5px}
.th .mv{left:5px}
.th .cover{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);color:#fff;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:4px 0}
.th.add{display:grid;place-items:center;background:var(--surface);border:1px dashed var(--line2);cursor:pointer;font-weight:700;font-size:12px;color:var(--muted);text-align:center;animation:none}
.th.add svg{width:24px;height:24px;margin:0 auto 4px;display:block}
.th.busy{display:grid;place-items:center;font-size:11px;color:var(--muted);background:linear-gradient(100deg,var(--surface) 30%,var(--surface2) 50%,var(--surface) 70%) 0 0/250% 100%;animation:shimmer 1.3s linear infinite}
.th.vid{background:#1b1b1b}
.th .vbadge{right:auto;left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:34px;height:34px}
.th .vbadge svg{width:12px;height:12px}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;font-weight:700;transition:transform .2s var(--spring),background .2s,color .2s}
.qchip:active{transform:scale(.94)}
.qchip.on{background:var(--inv);color:var(--inv-text);border-color:var(--inv)}
.danger{display:block;margin:28px auto 0;padding:10px;color:var(--signal);font-weight:700;font-size:14px}

::view-transition-group(pimg){animation-duration:.5s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.28s}

@media (min-width:700px){
  .hero{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1.1fr .9fr;column-gap:40px;align-items:start;padding-top:60px}
  .hero > :not(.show):not(.glow){grid-column:1}
  .show{grid-column:2;grid-row:1 / span 6;margin-top:0}
  .grid{grid-template-columns:repeat(4,1fr);max-width:1100px;margin:0 auto}
  .steps{grid-template-columns:repeat(4,1fr);max-width:1100px;margin:0 auto}
  .sec-head{max-width:1100px;margin:0 auto}
}

/* ---------- таблица мерок ---------- */
.mtab{display:grid;gap:0;border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.mtab div{display:flex;gap:14px;align-items:baseline;padding:11px 14px;font-size:13.5px;color:var(--muted)}
.mtab div + div{border-top:1px solid var(--line)}
.mtab b{min-width:38px;color:var(--text);font-weight:800}

/* ---------- заказы ---------- */
.ord{margin:12px 14px 0;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--surface);animation:cardIn .4s var(--ease) both}
.ord-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ord-h b{font-family:var(--display);font-size:13px}
.ord-h span{font-size:12px;color:var(--muted)}
.ord-h select{margin-left:auto;height:34px;border-radius:999px;border:1px solid var(--line2);background:var(--surface2);color:var(--text);padding:0 12px;font:700 12.5px var(--body)}
.ord-i{margin-top:10px;font-size:14px;line-height:1.5;font-weight:600}
.ord-s{margin-top:6px;font-size:14px}.ord-s span{color:var(--muted);font-size:12.5px}
.ord-c{margin-top:8px;font-size:12.5px;line-height:1.55;color:var(--muted)}
.edit-btn.solid{background:var(--surface);color:var(--text);border-color:var(--line2)}

/* ---------- компьютер ---------- */
@media (min-width:1000px){
  .bar{max-width:1240px;margin:0 auto;padding:12px 24px}
  .brand .logo-mono{width:30px}.brand .logo-word{width:132px}
  .chips{max-width:1240px;margin:0 auto;padding:10px 24px}
  .ind{top:10px}
  .grid{max-width:1240px;grid-template-columns:repeat(4,1fr);gap:34px 20px;padding:26px 24px 10px}
  .c-name{font-size:14px}.c-price{font-size:14px}

function explainError(err) {
  const m = String(err && err.message || err || '');
  if (/wrong password|401/i.test(m)) return 'Вход в админку устарел. Нажмите «Админ», выйдите и войдите заново.';
  if (/too big|413/i.test(m)) return 'Файл слишком большой: фото до 15 МБ, видео до 300 МБ. Видео можно сжать, отправив его себе в «Избранное» в Telegram.';
  if (/expired/i.test(m)) return 'Загрузка прервалась надолго. Попробуйте ещё раз.';
  if (/ffmpeg|ffprobe/i.test(m)) return 'Сервер не смог обработать это видео. Попробуйте другое или сначала сожмите его через Telegram.';
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Нет связи с сервером магазина. Проверьте интернет и попробуйте ещё раз.';
  return 'Не получилось: ' + (m || 'неизвестная ошибка') + '. Пришлите этот текст, разберёмся.';
}
function showError(err) {
  const text = explainError(err);
  try { if (tg && tg.showAlert) return tg.showAlert(text); } catch (e) {}
  alert(text);
}

// Сжимает фото с телефона до 1600 px, чтобы каталог грузился быстро
// Пробует несколько способов открыть фото: встроенные браузеры (в т.ч. Telegram на iPhone) ведут себя по-разному
const readAsDataURL = file => new Promise((res, rej) => {
  const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error || new Error('read')); r.readAsDataURL(file);
});
const loadImg = src => new Promise((res, rej) => {
  const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error('decode')); img.src = src;
});
async function decodeImage(file) {
  if (window.createImageBitmap) {
    try { const b = await createImageBitmap(file); if (b.width) return { src: b, w: b.width, h: b.height }; } catch (e) {}
  }
  let url = null;
  try {
    url = URL.createObjectURL(file);
    const img = await loadImg(url);
    return { src: img, w: img.naturalWidth, h: img.naturalHeight, done: () => URL.revokeObjectURL(url) };
  } catch (e) { if (url) try { URL.revokeObjectURL(url); } catch (x) {} }
  const img = await loadImg(await readAsDataURL(file));
  return { src: img, w: img.naturalWidth, h: img.naturalHeight };
}
async function shrink(file, max = 1600, q = 0.85) {
  try {
    const im = await decodeImage(file);
    const k = Math.min(1, max / Math.max(im.w, im.h));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(im.w * k)); c.height = Math.max(1, Math.round(im.h * k));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im.src, 0, 0, c.width, c.height);
    im.done && im.done(); im.src.close && im.src.close();
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    if (blob && blob.size > 100) return { blob, local: URL.createObjectURL(blob) };
  } catch (e) {}
  // Запасной путь: загрузить фото как есть, без сжатия
  if (file.size > 15 * 1024 * 1024) throw new Error('too big');
  return { blob: file, local: URL.createObjectURL(file) };
}
const MAX_VIDEO_MB = 300;
const isVideoFile = f => /^video\//.test(f.type) || /\.(mp4|mov|m4v|webm|3gp)$/i.test(f.name || '');
// Кадр из видео для превью в редакторе (настоящую обложку сделает сервер)
function videoPoster(file) {
  return new Promise((res, rej) => {
    let url; try { url = URL.createObjectURL(file); } catch (e) { return rej(e); }
    const v = document.createElement('video');
    let done = false;
    const fin = (ok, val) => { if (done) return; done = true; clearTimeout(timer); try { URL.revokeObjectURL(url); } catch (e) {} ok ? res(val) : rej(val); };
    const timer = setTimeout(() => fin(false, new Error('timeout')), 8000);
    v.muted = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto';
    v.onloadeddata = () => { try { v.currentTime = Math.min(0.5, (v.duration || 1) / 3); } catch (e) { fin(false, e); } };
    v.onseeked = () => {
      try {
        const k = Math.min(1, 600 / Math.max(v.videoWidth, v.videoHeight));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(v.videoWidth * k)); c.height = Math.max(1, Math.round(v.videoHeight * k));
        c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
        const d = c.toDataURL('image/jpeg', 0.8);
        d.length > 200 ? fin(true, { local: d }) : fin(false, new Error('empty'));
      } catch (e) { fin(false, e); }
    };
    v.onerror = () => fin(false, new Error('decode'));
    v.src = url; v.load();
  });
}
async function addPhotos(files) {
  const list = [...files].filter(f => !/^(audio|text)\//.test(f.type));
  for (let i = 0; i < list.length; i++) {
    const f = list[i];
    renderEdPhotos(`${i + 1} / ${list.length}`);
    if (isVideoFile(f)) {
      if (f.size > MAX_VIDEO_MB * 1024 * 1024) { toast(`Видео больше ${MAX_VIDEO_MB} МБ, выберите покороче`); continue; }
      let poster = null; try { poster = await videoPoster(f); } catch (e) {}
      state.ed.photos.push({ kind: 'video', file: f, local: poster ? poster.local : '' });
      continue;
    }
    try { const ph = await shrink(f); state.ed.photos.push({ kind: 'image', blob: ph.blob, local: ph.local }); }
    catch (e) { toast(e.message === 'too big' ? 'Фото больше 15 МБ, выберите поменьше' : 'Это фото не открылось, попробуйте другое'); }
  }
  renderEdPhotos();
}
// Файл уходит на сервер частями по 4 МБ: так не обрывается на мобильном интернете и видны проценты
async function sendFile(blob, kind, mime, onp) {
  const st = await api('upload/start', { kind, mime, size: blob.size });
  let chunk = st.chunk || 4 * 1024 * 1024, off = 0;
  while (off < blob.size) {
    onp && onp(Math.round(off / blob.size * 100));
    const part = blob.slice(off, Math.min(blob.size, off + chunk));
    let r = null, tries = 0;
    while (!r) {
      try {
        const res = await fetch(`${CONFIG.API_BASE}/api/admin/upload/chunk?id=${encodeURIComponent(st.id)}&offset=${off}`, { method: 'PUT', headers: { Authorization: 'Bearer ' + state.token, 'Content-Type': 'application/octet-stream' }, body: part });
        if (res.status === 413 && chunk > 256 * 1024) { chunk = Math.floor(chunk / 2); break; }
        const j = await res.json();
        if (!j.ok) throw new Error(j.error || 'upload');
        r = j;
      } catch (e) { if (++tries >= 4) throw e; await new Promise(z => setTimeout(z, 1200 * tries)); }
    }
    if (r) off = r.received;
  }
  onp && onp(100);
  const fin = await api('upload/finish', { id: st.id });
  if (fin.entry) return fin.entry;
  // видео: ждём, пока сервер обработает
  for (let i = 0; i < 600; i++) {
    await new Promise(z => setTimeout(z, 1500));
    const j = await api('job?id=' + encodeURIComponent(fin.job), null, 'GET');
    if (j.done) { if (j.error) throw new Error(j.error); return j.entry; }
    onp && onp(-1);
  }
  throw new Error('video timeout');
}
// Загрузить фото или видео и получить запись для галереи
async function uploadMedia(file, onmsg, maxSide) {
  if (isVideoFile(file)) {
    if (file.size > MAX_VIDEO_MB * 1024 * 1024) throw new Error('too big');
    return sendFile(file, 'video', file.type || 'video/mp4', p => onmsg(p < 0 ? 'Обрабатываем видео…' : `Загружаем ${p}%`));
  }
  onmsg('Загружаем…');
  const ph = await shrink(file, maxSide || 1600, 0.86);
  return sendFile(ph.blob, 'image', ph.blob.type || 'image/jpeg');
}

  const price = Number(String(e.price).replace(/\s/g, '').replace(',', '.'));
  const missing = [];
  if (!e.category.trim()) missing.push('category');

  }

    for (let i = 0; i < todo.length; i++) {
      const n = todo.length > 1 ? ` ${i + 1} из ${todo.length}` : '';

        todo[i].url = await sendFile(todo[i].file, 'video', todo[i].file.type || 'video/mp4', pct => { lbl.textContent = pct < 0 ? `Обрабатываем видео${n}…` : `Загружаем видео${n}: ${pct}%`; });
        continue;
      }
      lbl.textContent = `Загружаем фото${n}…`;
      todo[i].url = await sendFile(todo[i].blob, 'image', 'image/jpeg');
    }
    lbl.textContent = 'Сохраняем…';
    const sizes = splitSizes(e.sizes), up = sizes.map(x => x.toUpperCase());
    const measurements = {};
    String(e.measure || '').split('\n').forEach(line => { const m = line.match(/^\s*([^:—–-]{1,12}?)\s*[:—–-]\s*(.+)$/); if (m) measurements[m[1].trim().toUpperCase()] = m[2].trim(); });
    const o = e.orig || { name: {}, description: {} };

    if (e.name_en.trim()) name.en = e.name_en.trim(); else delete name.en;
    if (e.description_en.trim()) description.en = e.description_en.trim(); else delete description.en;
    const r = await api('save', { product: {
      id: e.id, category: e.category.trim(), name, description, price,
      sizes, soldOut: e.sold.filter(s => up.includes(s)), measurements,
      photos: e.photos.map(x => x.url), badge: e.badge.trim(), hidden: !e.show,

    await reloadProducts();

    closeSheet('eSheet');

    toast(e.id ? 'Изменения сохранены' : 'Товар добавлен');
  } catch (err) {
    btn.disabled = false; lbl.textContent = 'Сохранить';

  /* админ */
  if (b.id === 'admLogin') return doLogin();
  if (b.id === 'adminPill') { confirmBox('Выйти из режима админа?').then(ok => { if (ok) { state.token = ''; store.set('token', ''); setAdmin(false); reloadProducts().catch(() => {}); } }); return; }
  if (b.id === 'fab') { haptic(); return openEditor(null); }
  if (b.id === 'ordersPill') { haptic(); return openOrders(); }
  if (b.id === 'ordersCsv') return downloadCsv();
  if (b.id === 'impBtn') return runImport();
  if (b.id === 'botBtn') return botSetup();
  if (b.dataset.link) return openLink(b.dataset.link);
  if (b.id === 'editBtn') { haptic(); return openEditor(state.open); }
  if (b.id === 'edSave') return saveProduct();
  if (b.id === 'edDelete') return deleteProduct();
  if (b.dataset.ecat !== undefined) { setEdInput('category', b.dataset.ecat); document.querySelectorAll('[data-ecat]').forEach(x => x.classList.toggle('on', x === b)); $('[data-fw="e_category"]').classList.remove('bad'); haptic(); return; }
  if (b.dataset.epreset !== undefined) { setEdInput('sizes', b.dataset.epreset); state.ed.sold = []; renderEdSizes(); haptic(); return; }
  if (b.dataset.esz !== undefined) { const s = b.dataset.esz.toUpperCase(), so = state.ed.sold; so.includes(s) ? so.splice(so.indexOf(s), 1) : so.push(s); b.classList.toggle('so'); haptic(); return; }
  if (b.dataset.ebadge !== undefined) { setEdInput('badge', b.dataset.ebadge); renderEdBadges(); haptic(); return; }
  if (b.dataset.eshow) { state.ed.show = !state.ed.show; b.classList.toggle('on', state.ed.show); haptic(); return; }
  if (b.dataset.phdel !== undefined) { state.ed.photos.splice(+b.dataset.phdel, 1); renderEdPhotos(); haptic(); return; }
  if (b.dataset.phmv !== undefined) { const i = +b.dataset.phmv, a = state.ed.photos; [a[i - 1], a[i]] = [a[i], a[i - 1]]; renderEdPhotos(); haptic(); return; }
  if (b.dataset.cat) { if (b.dataset.cat === state.cat) return; state.cat = b.dataset.cat; haptic();
    document.querySelectorAll('.chip-c').forEach(x => x.classList.toggle('on', x === b)); moveIndicator(); renderGrid(true);
    const top = $('#chipsWrap').getBoundingClientRect().top + scrollY - $('#top').offsetHeight;
    if (scrollY > top) window.scrollTo({ top, behavior: reduced ? 'auto' : 'smooth' });
    return; }
  if (b.classList.contains('card')) return openProduct(b.dataset.id);
  if (b.dataset.size) { state.size = b.dataset.size; haptic();
    document.querySelectorAll('.size').forEach(x => x.classList.toggle('on', x === b)); $('#pHint').textContent = ''; return; }
  if (b.dataset.snd !== undefined) { const v = b.parentNode.querySelector('video'); if (v) { v.muted = !v.muted; b.innerHTML = v.muted ? SND_OFF : SND_ON; if (v.paused) { const pr = v.play(); pr && pr.catch(() => {}); } } return; }
  if (b.id === 'addBtn') return addToCart();
  if (b.id === 'askSize') { if (!openManager(`Здравствуйте! Интересует «${state.open.name.ru}». Есть ли другой размер?`)) toast(t('writeUs')); return; }
  if (b.id === 'cartBar') { renderCart(); $('#cSheet').scrollTop = 0; haptic(); return openSheet('cSheet'); }
  if (b.dataset.q !== undefined) {
    const l = cartLines()[+b.dataset.q], real = state.cart.find(x => x.id === l.id && x.size === l.size);
    real.qty += +b.dataset.d; if (real.qty <= 0) state.cart.splice(state.cart.indexOf(real), 1);
    store.set('cart', state.cart); renderCartBar(); haptic(); return renderCart();
  }
  if (b.dataset.del) { state.delivery = b.dataset.del; haptic(); return renderCart(); }
  if (b.id === 'orderBtn') return submitOrder();
  if (b.id === 'reopenChat') return openManager($('.done pre').textContent);
  if (b.id === 'themeBtn') { applyTheme(state.theme === 'dark' ? 'light' : 'dark'); store.set('theme', state.theme); haptic(); return; }
  if (b.id === 'heroMsg') { if (!openManager('Здравствуйте!')) openLink(CONFIG.TELEGRAM_URL); return; }
  if (b.id === 'lnkTg') return openLink(CONFIG.TELEGRAM_URL);
  if (b.id === 'lnkIg') return openLink(CONFIG.INSTAGRAM_URL);
  if (b.id === 'heroEdit') { $('#heroInput').click(); return; }
  if (b.id === 'heroCta') { const y = $('#chipsWrap').getBoundingClientRect().top + scrollY - $('#top').offsetHeight; return window.scrollTo({ top: y, behavior: reduced ? 'auto' : 'smooth' }); }
  if (b.id === 'langBtn') { haptic(); return openPicker('lang'); }
  if (b.id === 'curBtn') { haptic(); return openPicker('cur'); }
  if (b.dataset.lang) { state.lang = b.dataset.lang; store.set('lang', state.lang); haptic(); closeSheet('picker'); return renderAll(); }
  if (b.dataset.cur) { state.cur = b.dataset.cur; store.set('cur', state.cur); haptic(); closeSheet('picker'); return renderAll(); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.f;
  if (k) { state.form[k] = e.target.value; store.set('form', state.form); const w = e.target.closest('.bad'); w && w.classList.remove('bad'); }
  if (e.target.id === 'curSearch') renderCurrencies(e.target.value);
  const ek = e.target.dataset.e;
  if (ek && state.ed) {
    state.ed[ek] = e.target.value;
    const w = e.target.closest('.bad'); w && w.classList.remove('bad');
    if (ek === 'sizes') renderEdSizes();
    if (ek === 'badge') renderEdBadges();
    if (ek === 'category') document.querySelectorAll('[data-ecat]').forEach(x => x.classList.toggle('on', x.dataset.ecat === e.target.value.trim()));
  }
  if (e.target.id === 'admPass') { const w = e.target.closest('.bad'); w && w.classList.remove('bad'); $('#admHint').textContent = ''; }
});
document.addEventListener('change', e => {
  if (e.target.dataset.ost) { const sel = e.target; api('order-status', { number: sel.dataset.ost, status: sel.value }).then(() => toast(sel.dataset.ost + ': ' + sel.value)).catch(showError); return; }
  if (e.target.id === 'heroInput' && e.target.files.length) { const f = e.target.files[0]; e.target.value = ''; changeHero(f); return; }
  if (e.target.id === 'phInput' && e.target.files.length) { const f = [...e.target.files]; e.target.value = ''; addPhotos(f); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'admPass') doLogin(); });
addEventListener('resize', () => { setHH(); moveIndicator(); });
addEventListener('popstate', () => {
  const m = location.pathname.match(/^\/p\/(\d+)/);
  if (m) { if (!state.open || state.open.id !== m[1]) openProduct(m[1], true); }
  else if (state.open) closeProduct(true);
});

let toastT;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800); }
function setHH() { document.documentElement.style.setProperty('--hh', $('#top').offsetHeight + 'px'); }

/* ---------- старт ---------- */
applyTheme(store.get('theme', '') || systemTheme());
(async function init() {
  let seen = false; try { seen = sessionStorage.getItem('ps_splash'); sessionStorage.setItem('ps_splash', '1'); } catch (e) {}
  if (!seen && !reduced) { $('#splash').hidden = false; document.body.classList.add('splashed'); setTimeout(() => $('#splash').remove(), 1800); }
  else { $('#splash').remove(); document.body.classList.add('no-splash'); }
  setHH(); renderStatic(); renderHero();
  $('#grid').innerHTML = Array.from({ length: 9 }, () => '<div class="card"><div class="ph"></div></div>').join('');
  const ratesP = loadRates();
  try { state.products = await fetchProducts(); } catch (e) { state.loadError = true; }
  await ratesP;
  if (state.token) {
    try { await api('check', null, 'GET'); setAdmin(true, true); state.products = await fetchProducts(true); }
    catch (e) { if (/wrong password|401/.test(e.message)) { state.token = ''; store.set('token', ''); } }
  }
  if (/[?&]admin\b/.test(location.search) && !state.admin) openPicker('admin');
  // ссылка на товар: /p/12 на сайте или ?startapp=p12 в Telegram
  let start = ''; try { start = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || ''; } catch (e) {}
  const pm = location.pathname.match(/^\/p\/(\d+)/) || start.match(/^p(\d+)$/);
  if (!state.rates || !state.rates[state.cur]) state.cur = CONFIG.BASE_CURRENCY;
  state.cart = state.cart.filter(l => state.products.some(p => p.id === l.id));
  renderStatic(); renderChips(); renderGrid(true); renderCartBar(); renderHero();
  if (pm) {
    if (state.products.some(p => p.id === pm[1])) { history.replaceState(null, '', '/'); history.pushState({ p: pm[1] }, '', '/p/' + pm[1]); openProduct(pm[1], true); }
    else history.replaceState(null, '', '/');
  }
})();
</script>
</body>
</html>
